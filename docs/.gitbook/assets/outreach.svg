<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="680" viewBox="0 0 1440 680" role="img" aria-label="Three stages for outreach: access, activity and evidence. Count participation separately from learning and follow-up."><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#284054" stroke-width="1" opacity=".35"/></pattern><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1728"/><stop offset="1" stop-color="#153d4b"/></linearGradient><linearGradient id="metal" x2="0" y2="1"><stop stop-color="#d9f4ef"/><stop offset="1" stop-color="#6dabab"/></linearGradient></defs><rect width="100%" height="100%" rx="24" fill="url(#bg)"/><rect width="100%" height="100%" rx="24" fill="url(#grid)"/><g font-family="Arial, sans-serif"><rect x="60" y="42" width="260" height="38" rx="19" fill="#5eead4" fill-opacity=".12" stroke="#5eead4" stroke-opacity=".45"/><text x="78" y="68" fill="#5eead4" font-size="18" font-weight="700">TEAM / OUTREACH</text><text x="60" y="140" fill="#e6f4f5" font-size="43" font-weight="700">Build an experience worth returning to.</text><text x="60" y="193" fill="#a9c9d4" font-size="26" font-weight="400">Plan with a partner. Let participants make decisions.</text><rect x="60" y="280" width="400" height="260" rx="22" fill="#102a3c" stroke="#4d8390"/><text x="90" y="335" fill="#fbbf24" font-size="26" font-weight="700">01</text><text x="90" y="414" fill="#e6f4f5" font-size="32" font-weight="700">ACCESS</text><text x="90" y="479" fill="#a9c9d4" font-size="24" font-weight="400">Who can participate?</text><rect x="520" y="280" width="400" height="260" rx="22" fill="#102a3c" stroke="#4d8390"/><text x="550" y="335" fill="#fbbf24" font-size="26" font-weight="700">02</text><text x="550" y="414" fill="#e6f4f5" font-size="32" font-weight="700">ACTIVITY</text><text x="550" y="479" fill="#a9c9d4" font-size="24" font-weight="400">What will they try?</text><rect x="980" y="280" width="400" height="260" rx="22" fill="#102a3c" stroke="#4d8390"/><text x="1010" y="335" fill="#fbbf24" font-size="26" font-weight="700">03</text><text x="1010" y="414" fill="#e6f4f5" font-size="32" font-weight="700">EVIDENCE</text><text x="1010" y="479" fill="#a9c9d4" font-size="24" font-weight="400">What did they learn?</text><text x="60" y="620" fill="#e6f4f5" font-size="26" font-weight="400">Count participation separately from demonstrated learning and follow-up.</text></g></svg>