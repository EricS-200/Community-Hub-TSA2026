<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="680" viewBox="0 0 1440 680" role="img" aria-label="Concept mounting plate with four holes, with inputs, checks and handoff labels. This is not a manufacturing drawing."><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#284054" stroke-width="1" opacity=".35"/></pattern><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1728"/><stop offset="1" stop-color="#153d4b"/></linearGradient><linearGradient id="metal" x2="0" y2="1"><stop stop-color="#d9f4ef"/><stop offset="1" stop-color="#6dabab"/></linearGradient></defs><rect width="100%" height="100%" rx="24" fill="url(#bg)"/><rect width="100%" height="100%" rx="24" fill="url(#grid)"/><g font-family="Arial, sans-serif"><rect x="60" y="42" width="200" height="38" rx="19" fill="#5eead4" fill-opacity=".12" stroke="#5eead4" stroke-opacity=".45"/><text x="78" y="68" fill="#5eead4" font-size="18" font-weight="700">DESIGN / CAD</text><text x="60" y="140" fill="#e6f4f5" font-size="44" font-weight="700">Automate a repeatable feature.</text><text x="60" y="192" fill="#a9c9d4" font-size="26" font-weight="400">Specify inputs. Inspect geometry. Test the edge cases.</text><g transform="translate(190 290)"><path d="M0 160L375 50L590 170L215 280Z" fill="url(#metal)" stroke="#d9f4ef" stroke-width="4"/><path d="M0 160V187L215 307V280Z" fill="#497b87"/><path d="M215 280L590 170V197L215 307Z" fill="#33616f"/><g fill="#173d4a" stroke="#5b8993" stroke-width="4"><ellipse cx="145" cy="174" rx="28" ry="16"/><ellipse cx="290" cy="132" rx="28" ry="16"/><ellipse cx="300" cy="229" rx="28" ry="16"/><ellipse cx="444" cy="187" rx="28" ry="16"/></g><path d="M145 174L290 132M300 229L444 187M145 174L300 229" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="9 5"/></g><text x="900" y="300" fill="#5eead4" font-size="21" font-weight="700">INPUTS</text><text x="900" y="342" fill="#e6f4f5" font-size="23" font-weight="400">spacing · hole size · thickness</text><text x="900" y="408" fill="#5eead4" font-size="21" font-weight="700">CHECKS</text><text x="900" y="450" fill="#e6f4f5" font-size="23" font-weight="400">units · rebuild · clearances</text><text x="900" y="516" fill="#5eead4" font-size="21" font-weight="700">HANDOFF</text><text x="900" y="558" fill="#e6f4f5" font-size="23" font-weight="400">drawing · revision · design intent</text><text x="60" y="635" fill="#a9c9d4" font-size="21" font-weight="400">Concept plate · illustrative geometry, not a manufacturing drawing</text></g></svg>