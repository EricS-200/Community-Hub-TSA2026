<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="680" viewBox="0 0 1440 680" role="img" aria-label="Illustrative simulated route around an obstacle, with a reminder to test commands, coordinates, timing and model limitations."><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#284054" stroke-width="1" opacity=".35"/></pattern><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1728"/><stop offset="1" stop-color="#153d4b"/></linearGradient><linearGradient id="metal" x2="0" y2="1"><stop stop-color="#d9f4ef"/><stop offset="1" stop-color="#6dabab"/></linearGradient></defs><rect width="100%" height="100%" rx="24" fill="url(#bg)"/><rect width="100%" height="100%" rx="24" fill="url(#grid)"/><g font-family="Arial, sans-serif"><rect x="60" y="42" width="300" height="38" rx="19" fill="#5eead4" fill-opacity=".12" stroke="#5eead4" stroke-opacity=".45"/><text x="78" y="68" fill="#5eead4" font-size="18" font-weight="700">PRACTICE / SIMULATION</text><text x="60" y="140" fill="#e6f4f5" font-size="46" font-weight="700">Learn before you get robot time.</text><text x="60" y="191" fill="#a9c9d4" font-size="26" font-weight="400">Make assumptions visible. Save evidence. Transfer carefully.</text><rect x="65" y="242" width="800" height="360" rx="16" fill="#0b1728" stroke="#486474"/><path d="M105 262V582" stroke="#233c50"/><path d="M175 262V582" stroke="#233c50"/><path d="M245 262V582" stroke="#233c50"/><path d="M315 262V582" stroke="#233c50"/><path d="M385 262V582" stroke="#233c50"/><path d="M455 262V582" stroke="#233c50"/><path d="M525 262V582" stroke="#233c50"/><path d="M595 262V582" stroke="#233c50"/><path d="M665 262V582" stroke="#233c50"/><path d="M735 262V582" stroke="#233c50"/><path d="M805 262V582" stroke="#233c50"/><path d="M85 282H845" stroke="#233c50"/><path d="M85 342H845" stroke="#233c50"/><path d="M85 402H845" stroke="#233c50"/><path d="M85 462H845" stroke="#233c50"/><path d="M85 522H845" stroke="#233c50"/><path d="M85 582H845" stroke="#233c50"/><rect x="428" y="330" width="125" height="130" rx="12" fill="#24485b" stroke="#698995"/><path d="M150 532C290 525 240 284 450 280S650 280 754 492" fill="none" stroke="#5eead4" stroke-width="7" stroke-dasharray="13 9"/><circle cx="150" cy="532" r="18" fill="#fbbf24"/><circle cx="754" cy="492" r="18" fill="#93c5fd"/><text x="930" y="290" fill="#e6f4f5" font-size="29" font-weight="700">Commands &amp; state</text><text x="930" y="375" fill="#e6f4f5" font-size="29" font-weight="700">Pose &amp; coordinates</text><text x="930" y="460" fill="#e6f4f5" font-size="29" font-weight="700">Timing &amp; failures</text><text x="930" y="545" fill="#e6f4f5" font-size="29" font-weight="700">Model limitations</text><text x="65" y="645" fill="#a9c9d4" font-size="21" font-weight="400">Illustrative route · not a competition field or validated trajectory</text></g></svg>