mmand changes</text><text x="605" y="594" fill="#5eead4" font-size="22" font-weight="400">Observe lag / overshoot</text><text x="1090" y="594" fill="#a9c9d4" font-size="22" font-weight="400">Time →</text><text x="90" y="637" fill="#e6f4f5" font-size="23" font-weight="400">Read the target, measured position, output, enable state and timestamps together.</text></g></svg>