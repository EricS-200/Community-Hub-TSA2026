<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="680" viewBox="0 0 1440 680" role="img" aria-label="Assistant connects through a specific MCP server to an application. Verify the account and document before writing."><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#284054" stroke-width="1" opacity=".35"/></pattern><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1728"/><stop offset="1" stop-color="#153d4b"/></linearGradient><linearGradient id="metal" x2="0" y2="1"><stop stop-color="#d9f4ef"/><stop offset="1" stop-color="#6dabab"/></linearGradient></defs><rect width="100%" height="100%" rx="24" fill="url(#bg)"/><rect width="100%" height="100%" rx="24" fill="url(#grid)"/><g font-family="Arial, sans-serif"><rect x="60" y="42" width="240" height="38" rx="19" fill="#5eead4" fill-opacity=".12" stroke="#5eead4" stroke-opacity=".45"/><text x="78" y="68" fill="#5eead4" font-size="18" font-weight="700">WORKFLOW / MCP</text><text x="60" y="140" fill="#e6f4f5" font-size="48" font-weight="700">Connect deliberately.</text><text x="60" y="193" fill="#a9c9d4" font-size="26" font-weight="400">One task. The right application. A verified result.</text><rect x="60" y="270" width="400" height="224" rx="20" fill="#102a3c" stroke="#4d8390" stroke-width="2"/><text x="88" y="320" fill="#5eead4" font-size="24" font-weight="700">01</text><text x="88" y="383" fill="#e6f4f5" font-size="29" font-weight="700">ASSISTANT</text><text x="88" y="434" fill="#a9c9d4" font-size="24" font-weight="400">You define the task</text><path d="M472 382h35m-10-10l10 10-10 10" stroke="#fbbf24" stroke-width="3" fill="none"/><rect x="520" y="270" width="400" height="224" rx="20" fill="#102a3c" stroke="#4d8390" stroke-width="2"/><text x="548" y="320" fill="#5eead4" font-size="24" font-weight="700">02</text><text x="548" y="383" fill="#e6f4f5" font-size="29" font-weight="700">MCP SERVER</text><text x="548" y="434" fill="#a9c9d4" font-size="24" font-weight="400">Exposes specific tools</text><path d="M932 382h35m-10-10l10 10-10 10" stroke="#fbbf24" stroke-width="3" fill="none"/><rect x="980" y="270" width="400" height="224" rx="20" fill="#102a3c" stroke="#4d8390" stroke-width="2"/><text x="1008" y="320" fill="#5eead4" font-size="24" font-weight="700">03</text><text x="1008" y="383" fill="#e6f4f5" font-size="29" font-weight="700">APPLICATION</text><text x="1008" y="434" fill="#a9c9d4" font-size="24" font-weight="400">CAD / repository / data</text><text x="60" y="577" fill="#e6f4f5" font-size="28" font-weight="400">Verify the account and document before allowing a write action.</text><text x="60" y="626" fill="#a9c9d4" font-size="23" font-weight="400">Local address ≠ cloud endpoint · tool access ≠ engineering validation</text></g></svg>